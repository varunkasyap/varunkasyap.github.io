<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Varun Kasyap</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("theme"); } catch (e) {}
      var theme = (stored === "dark" || stored === "light")
        ? stored
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#000000" : "#ffffff");
    })();
  </script>
</head>

<body>

  <button id="themeToggle">Dark Mode</button>

  <img src="headshot.jpeg" alt="Varun Kasyap Headshot" class="avatar" width="180" height="180">
  <h1>Varun Kasyap Pentamaraju</h1>
  <p class="title">Software Engineer</p>
  <p class="load-time" id="loadTime" aria-live="polite"></p>
  <p class="load-note">It takes a human roughly 100 milliseconds to perceive a website load</p>
  <div class="contact-info">
    <a href="mailto:varunkasyap@hotmail.com" class="email">varunkasyap@hotmail.com</a>
    <a href="https://linkedin.com/in/varunkasyap" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" class="social-link">

          d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />

  <div class="section-container" id="contributions">

  </div>

  <script src="lib.js"></script>

</body>

</html>
